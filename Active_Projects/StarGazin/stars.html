<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identified Stars</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Identified Stars</h1>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Star Name</th>
                    <th scope="col">Right Ascension</th>
                    <th scope="col">Declination</th>
                </tr>
            </thead>
            <tbody>
                {% for star in stars %}
                    <tr>
                        <td>{{ star.name }}</td>
                        <td>{{ star.ra }}</td>
                        <td>{{ star.dec }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Control Panel</a>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
